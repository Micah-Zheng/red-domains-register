name: 注销 / 删除数据
description: 注销自己的子域名，或请求删除邮箱明文记录
labels: [removal]
body:
  - type: markdown
    attributes:
      value: |
        只想注销域名的话，直接提 PR 删掉自己的 JSON 文件更快。
        本模板用于请求删除侧仓里的邮箱明文（公开仓库内只有哈希）。
  - type: input
    id: domain
    attributes:
      label: 你的域名
      placeholder: example.tcp.red
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我是该域名的申请者，提交本 issue 的账号与 owner.github 一致
          required: true
        - label: 我理解 Git 历史不可逆，公开仓库中的哈希与解析目标已成为历史记录
          required: true
