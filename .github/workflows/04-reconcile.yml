# 阶段 ④：每日对账。Git（事实源）↔ Cloudflare（实际生效）。
#
# 独立于下发存在：下发只处理「本次 PR 改了什么」，对账处理「两边是否还一致」。
# 面板手工改动、下发中途失败、JSON 删了但下发没跑成 —— 这些只有对账能发现。
#
# 默认不删除。补齐缺失和纠正漂移是幂等的、以 Git 为准的操作，可以自动做；
# 删除不可逆，需要运营者手动跑 workflow_dispatch 并显式勾选。

name: 04 · 每日对账

on:
  schedule:
    - cron: '17 3 * * *'      # UTC 03:17，避开整点的 API 高峰
  workflow_dispatch:
    inputs:
      apply:
        description: '补齐缺失、纠正漂移'
        type: boolean
        default: false
      allow_delete:
        description: '删除孤儿记录（不可逆）'
        type: boolean
        default: false
      max_delete:
        description: '单次删除上限'
        type: string
        default: '5'

permissions:
  contents: read
  issues: write               # 发现漂移时开 issue 提醒

concurrency:
  group: deploy-dns           # 与阶段③同组：对账与下发绝不同时动 CF。
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: 对账
        id: recon
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RECONCILE_REPORT: reconcile.json
          RECONCILE_TIMESTAMP: ${{ github.event.repository.pushed_at }}
          MAX_DELETE: ${{ inputs.max_delete || '5' }}
        run: |
          args="."
          if [ "${{ inputs.apply }}" = "true" ]; then args="$args --apply"; fi
          if [ "${{ inputs.allow_delete }}" = "true" ]; then args="$args --allow-delete"; fi
          node scripts/reconcile.mjs $args
        continue-on-error: true

      # DNSSEC 信任链一致性。放在对账里，因为它是同一类工作：比对「声明」与
      # 「现实」。两个域在 DNSPod 上开着 clientUpdateProhibited，该锁会挡住注册局
      # 侧一切更新（**含 DS**）；而 zone 用 CF 托管 DNSSEC。若 CF 轮换 KSK 而新 DS
      # 推不上去，信任链断裂 —— 后果不是某条记录不解析，而是两个域对所有验证型
      # 解析器整体 SERVFAIL。它比记录漂移隐蔽得多：面板正常、对账正常、不校验的
      # 解析器也正常，只有真实用户打不开。
      - name: DNSSEC 信任链检查
        id: dnssec
        env:
          DNSSEC_ZONES: tcp.red,udp.red
        run: node scripts/check-dnssec.mjs
        continue-on-error: true      # 不阻断对账主流程，但下面会开 issue

      - name: 信任链异常则提醒
        if: always() && steps.dnssec.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" \
            --title "DNSSEC 信任链异常 —— 可能导致整域解析失败" \
            --body "$(printf '%s\n' \
              '每日检查发现注册局的 DS 与 zone 当前的 KSK 对不上，或 DS 已消失。' '' \
              '**影响面**：所有开启 DNSSEC 校验的解析器（含 1.1.1.1 / 8.8.8.8 与多数 ISP 递归）' \
              '会拒绝解析本域 —— 相当于整域下线，而面板、对账、不校验的解析器都显示正常。' '' \
              '**最可能的原因**：Cloudflare 轮换了 KSK，而注册商（DNSPod）的' \
              '`clientUpdateProhibited` 锁挡住了 DS 更新。' '' \
              '**处置**：DNSPod 解锁 → 用 CF 面板给出的新 DS 更新注册局 → 重新加锁。' '' \
              "运行记录：$RUN_URL")"

      - name: 上传对账报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reconcile-report
          path: reconcile.json
          retention-days: 30

      # 定时跑发现漂移时开 issue。孤儿记录仍在对外解析，属于需要人看到的事。
      - name: 有漂移则提醒
        if: always() && steps.recon.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/reconcile-issue.mjs reconcile.json
